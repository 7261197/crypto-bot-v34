name: Crypto Trader v34
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  run-trader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install ccxt pyTelegramBotAPI
      - name: Run Trader
        run: python trader.py
