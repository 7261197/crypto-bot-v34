name: Crypto Trader v34
on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-trader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install ccxt pyTelegramBotAPI
      - name: Run Trader
        run: python trader.py
      - name: Save state to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_state_v34.json
          git diff --staged --quiet || git commit -m "state update"
          git push
